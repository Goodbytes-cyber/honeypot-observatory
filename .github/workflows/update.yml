# Weekly copy of the public observatory files from goodbytes.fr.
# The data are computed every Monday at 03:15 UTC and the CSV is rebuilt at hh:41;
# this job runs at 05:30 UTC and commits only when the files changed.
name: Update data

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download the public files
        run: |
          mkdir -p "$RUNNER_TEMP/new"
          for f in observatoire.json observatoire.csv; do
            curl -fsS --max-time 30 --retry 3 --max-filesize 1000000 \
              -A "honeypot-observatory-update (github.com/Goodbytes-cyber)" \
              -o "$RUNNER_TEMP/new/$f" "https://goodbytes.fr/$f"
          done

      - name: Check them
        run: python3 .github/scripts/check.py "$RUNNER_TEMP/new/observatoire.json" data/observatoire.json "$RUNNER_TEMP/new/observatoire.csv"

      - name: Commit if changed
        run: |
          cp "$RUNNER_TEMP/new/observatoire.json" "$RUNNER_TEMP/new/observatoire.csv" data/
          if git diff --quiet -- data/; then
            echo "no change"
            exit 0
          fi
          end=$(python3 -c "import json;print(json.load(open('data/observatoire.json'))['period']['end'][:10])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Data up to $end"
          git push
